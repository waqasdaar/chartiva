  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="172" y="96" font-size="66" font-weight="800" letter-spacing="-2" fill="#0B1023">Chart<tspan fill="url(#word)">iva</tspan></text>
    <text x="175" y="128" font-size="17" font-weight="500" letter-spacing="0.4" fill="#5B6475">AI charts, dashboards &amp; data analysis · for any AI assistant</text>
