    <path fill="#A855F7" d="M-27.98,-16.15A3.5,3.5,0,0,1,-29.05,-21.25A36,36,0,0,1,25.81,-25.09A3.5,3.5,0,0,1,25.46,-19.89L17.51,-13.68A3.5,3.5,0,0,1,12.97,-13.88A19,19,0,0,0,-14.77,-11.94A3.5,3.5,0,0,1,-19.24,-11.11Z"/>
  </g>
