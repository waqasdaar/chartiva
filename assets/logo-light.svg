    <path fill="#FFB020" d="M25.11,20.33A3.5,3.5,0,0,1,25.37,25.53A36,36,0,0,1,-12.20,33.86A3.5,3.5,0,0,1,-14.16,29.04L-9.74,19.97A3.5,3.5,0,0,1,-5.57,18.16A19,19,0,0,0,12.72,14.10A3.5,3.5,0,0,1,17.27,13.98Z"/>
