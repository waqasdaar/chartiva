<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" role="img" aria-labelledby="t d">
  <title id="t">Chartiva</title>
  <desc id="d">Chartiva: AI charts, dashboards and data analysis for your AI assistant</desc>
  <g transform="translate(16 16)">
<defs>
    <linearGradient id="m-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D1856"/>
      <stop offset="1" stop-color="#070A1F"/>
