  <rect x="64" y="55" width="18" height="6" rx="2.2" fill="url(#m-stem)"/>
  <rect x="64" y="67" width="18" height="6" rx="2.2" fill="url(#m-stem)"/>
  <path d="M80 50 h8 a10 10 0 0 1 10 10 v8 a10 10 0 0 1 -10 10 h-8 a3 3 0 0 1 -3 -3 v-22 a3 3 0 0 1 3 -3 z" fill="url(#m-stem)"/>
  <rect x="96" y="59.5" width="18" height="9" rx="4.5" fill="url(#m-stem)"/>
</g>
  <defs>
